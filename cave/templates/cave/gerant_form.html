{% extends "cave/base.html" %}
{% block titre %}{{ titre }}{% endblock %}
{% block contenu %}
<div class="entete-page"><h1>{{ titre }}</h1></div>
<div class="carte" style="max-width:560px">
  <form method="post">
    {% csrf_token %}
    {% include "cave/_form.html" %}
    <button class="bouton principal" type="submit">Enregistrer</button>
    <a class="bouton" href="{% url 'gerants' %}">Retour</a>
  </form>
</div>
{% endblock %}

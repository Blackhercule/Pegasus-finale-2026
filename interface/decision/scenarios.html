<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparer des scénarios — Assainissement de Ouaga</title>
<link rel="stylesheet" href="/decision/style.css">
<link rel="stylesheet" href="/decision/verifier.css">
<link rel="stylesheet" href="/decision/scenarios.css">
</head>
<body class="page-verifier">
<header class="bandeau">
  <div>
    <h1>Comparer des scénarios</h1>
    <p class="sous-titre">Que se passe-t-il si on change les moyens ? · Groupe Pegasus</p>
  </div>
  <nav><a href="/decision/">Carte</a> <a href="/decision/verifier.html">Vérifier</a></nav>
</header>

<main>
  <p class="aide">Chaque scénario est calculé en entier : le plan de gestion est refait, puis la
    filière est simulée jour par jour. Rien n'est pré-calculé.</p>

  <div class="scenarios" id="scenarios"></div>

  <div class="barre-action">
    <label>Durée simulée
      <select id="jours">
        <option value="15">15 jours</option>
        <option value="30" selected>30 jours</option>
        <option value="90">90 jours</option>
      </select>
    </label>
    <button type="button" id="comparer">Comparer</button>
    <span id="etat"></span>
  </div>

  <section id="resultats" hidden>
    <table id="tableau-resultats"></table>
    <figure id="graphique" hidden>
      <figcaption>Déchets accumulés en dépotoir, en milliers de m³</figcaption>
      <div id="courbes"></div>
    </figure>
  </section>
</main>

<script src="/decision/scenarios.js"></script>
</body>
</html>
